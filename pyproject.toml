[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.1.0"
description = "AI-Powered Intelligent File System Organizer (Phase 1: Rule-Based)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "filetype>=1.2.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
ml = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.scripts]
organizer = "cli.main:app"

[tool.setuptools.packages.find]
# Include organizer_api so the backend installs
include = ["organizer*", "cli*", "organizer_api*"]
exclude = ["config*", "tests*"]

# Ensure the static frontend files and AI models are included in the build
[tool.setuptools.package-data]
"organizer_api" = ["../frontend/dist/**/*"]
"organizer.ai" = ["models/*.json", "models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"